<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <script>
        (function () {
            var d = document.documentElement, t, l;
            try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
            if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            if (!l) l = (navigator.language || 'fr').slice(0, 2) === 'fr' ? 'fr' : 'en';
            d.setAttribute('data-theme', t); d.setAttribute('lang', l);
        })();
    </script>
    <title>Page introuvable / Page not found — Baraza All Services</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
    <style>[lang="fr"] .en, [lang="en"] .fr { display: none; }</style>
</head>
<body>
    <main class="final-cta" style="min-height:100vh;display:grid;place-items:center">
        <div class="container final-cta__inner">
            <p class="eyebrow">404</p>
            <h1 style="font-size:clamp(36px,6vw,60px);margin-bottom:16px">
                <span class="fr">Cette page <span class="accent">n’existe pas</span></span>
                <span class="en">This page <span class="accent">doesn’t exist</span></span>
            </h1>
            <p class="fr">Le lien est peut-être erroné ou la page a été déplacée.</p>
            <p class="en">The link may be wrong or the page may have moved.</p>
            <div class="hero__actions hero__actions--center">
                <a class="btn btn--primary btn--lg" href="/"><span class="fr">Retour à l’accueil</span><span class="en">Back to home</span></a>
                <a class="btn btn--ghost btn--lg" href="/#devis"><span class="fr">Demander un devis</span><span class="en">Request a quote</span></a>
            </div>
        </div>
    </main>
</body>
</html>
